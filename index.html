    :root {

    }
    body {
      font-family: 'Rajdhani', sans-serif;

        radial-gradient(circle at 15% 20%, rgba(34, 211, 238, .12), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(244, 114, 182, .12), transparent 40%),
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: auto, auto, 40px 40px, 40px 40px;
      min-height: 100vh;
    }
    .font-display { font-family: 'Orbitron', sans-serif; }
    .glow-p1 { color: var(--p1); text-shadow: 0 0 8px var(--p1), 0 0 20px rgba(34,211,238,.5); }
    .glow-p2 { color: var(--p2); text-shadow: 0 0 8px var(--p2), 0 0 20px rgba(244,114,182,.5); }
    .glow-accent { color: var(--accent); text-shadow: 0 0 8px var(--accent); }
    .panel {
      background: rgba(15, 10, 35, .75);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(6px);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    }
    .border-p1 { border-color: var(--p1); box-shadow: 0 0 18px rgba(34,211,238,.35) inset; }
    .border-p2 { border-color: var(--p2); box-shadow: 0 0 18px rgba(244,114,182,.35) inset; }
    .portrait {
      border: 2px solid;
      background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.08), #0b0820 70%);
      overflow: hidden;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }
    .slot-btn { transition: all .2s ease; }
    .slot-btn:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.25); }
    .slot-btn:disabled { cursor: not-allowed; }
    @keyframes popIn { from { opacity: 0; transform: scale(.9) translateY(10px); } to { opacity: 1; transform: none; } }
    .pop-in { animation: popIn .45s ease both; }
    @keyframes flicker { 0%,19%,21%,23%,55%,57%,100% { opacity: 1; } 20%,22%,56% { opacity: .4; } }
    .flicker { animation: flicker 3s infinite; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .shake { animation: shake .3s ease 2; }
    /* ---- Rarezas ---- */
    .rarity-badge {
      display: inline-block; padding: 2px 8px;
      font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: .15em;
      color: var(--r); border: 1px solid var(--r); text-shadow: 0 0 6px var(--r);
      background: rgba(0,0,0,.4); white-space: nowrap;
    }
    .rarity-glow { line-height: 0; box-shadow: 0 0 16px var(--r), 0 0 34px rgba(0,0,0,0); }
    @keyframes mythicHue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    .rarity-badge.mythic { animation: mythicHue 3s linear infinite; }
    @keyframes mythicGlow {
      0%, 100% { box-shadow: 0 0 18px #f43f5e, 0 0 40px rgba(244,63,94,.5); }
      33%      { box-shadow: 0 0 18px #a855f7, 0 0 40px rgba(168,85,247,.5); }
      66%      { box-shadow: 0 0 18px #facc15, 0 0 40px rgba(250,204,21,.5); }
    }
    .rarity-glow.mythic { animation: mythicGlow 2.4s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rarity-badge.mythic, .rarity-glow.mythic { animation: none; } }

    /* ---- Arena de batalla ---- */
    @keyframes slam { 0% { opacity: 0; transform: scale(3); filter: blur(8px); } 60% { opacity: 1; transform: scale(.92); filter: none; } 100% { opacity: 1; transform: scale(1); } }
    .slam { animation: slam .55s cubic-bezier(.2,.9,.3,1.2) both; }
    @keyframes slideL { from { opacity: 0; transform: translateX(-120%) skewX(-12deg); } to { opacity: 1; transform: none; } }
    @keyframes slideR { from { opacity: 0; transform: translateX(120%) skewX(12deg); } to { opacity: 1; transform: none; } }
    .slide-l { animation: slideL .6s cubic-bezier(.2,.9,.3,1.1) both; }
    .slide-r { animation: slideR .6s cubic-bezier(.2,.9,.3,1.1) both; }
    @keyframes vsPulse { 0%,100% { transform: scale(1); text-shadow: 0 0 10px #fff, 0 0 30px var(--accent); } 50% { transform: scale(1.18); text-shadow: 0 0 20px #fff, 0 0 60px var(--accent); } }
    .vs { animation: vsPulse .8s ease-in-out infinite; }
    @keyframes aura { 0%,100% { box-shadow: 0 0 12px var(--c); } 50% { box-shadow: 0 0 40px var(--c), 0 0 80px var(--c); } }
    .aura { line-height: 0; }
    .aura.charging { animation: aura .45s ease-in-out infinite; }
    .fighter { transition: transform .4s ease, filter .4s ease, opacity .4s ease; }
    .fighter.winner { transform: scale(1.1); filter: drop-shadow(0 0 18px var(--c)); }
    .fighter.loser { transform: scale(.92) translateY(6px); filter: grayscale(1) brightness(.55); opacity: .6; }
    @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
    .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; z-index: 10; animation: flash .5s ease-out forwards; }
    @keyframes bigShake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-10px,4px); } 40% { transform: translate(8px,-6px); } 60% { transform: translate(-6px,2px); } 80% { transform: translate(4px,-2px); } }
    .big-shake { animation: bigShake .45s ease; }
    @keyframes stamp { from { opacity: 0; transform: translate(-50%,-50%) scale(2.5) rotate(-12deg); } to { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-6deg); } }
    .stamp { position: absolute; left: 50%; top: 50%; animation: stamp .35s cubic-bezier(.2,.9,.3,1.3) forwards; }
    .speedlines {
      position: absolute; inset: -50%; pointer-events: none;
      background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.06) 0deg 2deg, transparent 2deg 9deg);
      animation: spin 24s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }
    .bump { animation: bump .5s ease; }
    @media (prefers-reduced-motion: reduce) {

/* =========================================================================
 * 2. CONFIGURACIÓN DE CATEGORÍAS
 * ========================================================================= */
const CATEGORIES = [
  { key: 'fuerza',      label: 'Fuerza',      icon: '💪' },
  { key: 'velocidad',   label: 'Velocidad',   icon: '⚡' },
  { key: 'habilidad',   label: 'Habilidad',   icon: '🎯' },
  { key: 'iq',          label: 'IQ de combate', icon: '🧠' }, // táctica e instinto en pelea, no inteligencia general
  { key: 'resistencia', label: 'Resistencia', icon: '🛡️' },
];
const TOTAL_ROUNDS = CATEGORIES.length;

/* =========================================================================
 * 2b. RAREZAS
 *     Se calculan a partir de la suma de las 5 estadísticas (máx. 500).
 *     Ordenadas de mayor a menor: gana el primer umbral que se alcance.
 * ========================================================================= */
const RARITIES = [
  { key: 'mitico',     label: 'Mítico',     min: 455, color: '#f43f5e', icon: '✦' },
  { key: 'legendario', label: 'Legendario', min: 425, color: '#facc15', icon: '★' },
  { key: 'raro',       label: 'Raro',       min: 390, color: '#60a5fa', icon: '◆' },
  { key: 'comun',      label: 'Común',      min: 0,   color: '#94a3b8', icon: '●' },
];

const statTotal = (ch) => CATEGORIES.reduce((sum, c) => sum + ch.stats[c.key], 0);
const getRarity = (total) => RARITIES.find((r) => total >= r.min);

CHARACTER_POOL.forEach((c) => { c.rarity = getRarity(statTotal(c)); });
const PLAYER_META = [
  { id: 0, name: 'Jugador 1', glow: 'glow-p1', border: 'border-p1', color: 'var(--p1)' },
  // En modo 1 jugador el segundo puesto lo ocupa la CPU (el nombre se calcula según el modo)
  { id: 1, get name() { return state.mode === 'solo' ? 'CPU' : 'Jugador 2'; }, glow: 'glow-p2', border: 'border-p2', color: 'var(--p2)' },
];

/* =========================================================================
 * 2c. MODO 1 JUGADOR: dificultades de la CPU
 *     noise:   error (±) con el que la CPU "recuerda" cada estadística
 *     blunder: probabilidad de colocar la carta en un slot al azar
 *     jokers:  si usa descarte y robo
 * ========================================================================= */
const DIFFICULTIES = {
  facil:   { label: 'Fácil',   noise: 25, blunder: 0.3, jokers: false },
  normal:  { label: 'Normal',  noise: 12, blunder: 0.1, jokers: true },
  dificil: { label: 'Difícil', noise: 4,  blunder: 0,   jokers: true },
};

/* Opciones del menú inicial (no forman parte de la partida) */
const menu = { difficulty: 'normal' };
function setMenuDifficulty(d) { menu.difficulty = d; render(); }

/* Récord contra la CPU guardado en el navegador (si el almacenamiento falla, se ignora) */
const Record = {
  KEY: 'animeDraft.cpuRecord',
  load() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch { return {}; }
  },
  add(difficulty, winner) {
    const all = this.load();
    const r = all[difficulty] || { w: 0, l: 0, d: 0 };
    if (winner === 0) r.w++; else if (winner === 1) r.l++; else r.d++;
    all[difficulty] = r;
    try { localStorage.setItem(this.KEY, JSON.stringify(all)); } catch { /* sin almacenamiento */ }
  },
  text(difficulty) {
    const r = this.load()[difficulty];
    return r ? `${r.w}V · ${r.l}D${r.d ? ` · ${r.d}E` : ''}` : 'sin partidas';
  },
};

/* =========================================================================
 * 3. ESTADO DEL JUEGO
 *    Fuente única de verdad. Toda mutación pasa por las funciones de Game.
 * ========================================================================= */
const createInitialState = (mode = 'duo', difficulty = 'normal') => ({
  phase: 'start',          // 'start' | 'draft' | 'battle' | 'result'
  mode,                    // 'duo' = 2 jugadores en la misma pantalla · 'solo' = contra la CPU
  difficulty,              // clave de DIFFICULTIES (solo se usa en modo 'solo')
  cpu: null,               // modo solo: estadísticas tal como las "percibe" la CPU
  round: 1,                // 1..5
  currentPlayer: 0,        // 0 = J1, 1 = J2
  deck: [],                // personajes restantes (barajados, sin repetir)
  currentCharacter: null,  // personaje ofrecido al jugador en turno
  players: [
    // slots: { fuerza: personaje, ... } · comodines de un solo uso por partida
    { slots: {}, steals: 1, discards: 1 },
    { slots: {}, steals: 1, discards: 1 },
  ],
  steal: null,             // robo en curso: { targetKey: null | categoría del rival }
  stolenIds: [],           // ids ya robados: no se pueden volver a robar
  notice: null,            // aviso de la última acción especial (robo/descarte)
  battle: { results: [], wins: [0, 0], winner: null },
  busy: false,             // bloquea entradas durante animaciones
});

let state = createInitialState();

/* =========================================================================
 * 3b. IMÁGENES LOCALES
 *     Cada personaje busca su retrato en img/<slug>.jpg (luego .png y .webp).
 *     Si no existe ningún archivo, se muestra un avatar neón con iniciales.
 * ========================================================================= */
const IMAGE_DIR = "img/";
const IMAGE_EXTENSIONS = ["jpg", "png", "webp"];

/** "Monkey D. Luffy" -> "monkey-d-luffy" */
const slugify = (name) => name
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

CHARACTER_POOL.forEach((c, i) => {
  c.id = i;
  c.slug = slugify(c.name);
});

/* slug -> índice de extensión que cargó, o -1 si no hay imagen (evita reintentos al repintar) */
const imageResolved = new Map();

function imageLoaded(img) {
  imageResolved.set(img.dataset.slug, Number(img.dataset.ext));
}

/** Si una extensión falla, prueba la siguiente; si no queda ninguna, deja el avatar. */
function nextImageExt(img) {
  const i = Number(img.dataset.ext) + 1;
  if (i >= IMAGE_EXTENSIONS.length) { imageResolved.set(img.dataset.slug, -1); img.remove(); return; }
  img.dataset.ext = i;
  img.src = IMAGE_DIR + img.dataset.slug + "." + IMAGE_EXTENSIONS[i];
}

/* Utilidad: barajado Fisher-Yates (no muta el original) */
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* =========================================================================
 * 4. LÓGICA DEL DRAFT
 * ========================================================================= */
const Game = {
  start(mode = 'duo', difficulty = 'normal') {
    state = createInitialState(mode, difficulty);
    state.phase = 'draft';
    state.deck = shuffle(CHARACTER_POOL);
    if (mode === 'solo') state.cpu = CPU.buildPerception(difficulty);
    this.drawCharacter();
    render();
  },

  /** Modo solo: ¿le toca a la CPU? (la CPU siempre es el jugador 2) */
  isCpuTurn: () => state.mode === 'solo' && state.currentPlayer === 1,

  /** Las acciones del humano se ignoran durante animaciones o el turno de la CPU. */
  blocked(byCpu) {
    return state.phase !== 'draft' || (!byCpu && (state.busy || this.isCpuTurn()));
  },

  /** Saca el siguiente personaje del mazo para el jugador en turno. */
  drawCharacter() {
    state.currentCharacter = state.deck.pop();
  },

  /** Atajos del jugador en turno y su rival. */
  me: () => state.players[state.currentPlayer],
  rival: () => state.players[1 - state.currentPlayer],

  /**
   * El jugador en turno coloca un personaje en un slot vacío:
   * - normal: el personaje que le ha tocado.
   * - robando: el personaje robado (y el rival recibe la carta actual a cambio).
   */
  assignSlot(categoryKey, byCpu = false) {
    if (this.blocked(byCpu)) return;
    const player = this.me();
    if (player.slots[categoryKey]) return; // slot ya usado: ignorar

    // Si la CPU descartó antes en este turno, su aviso se conserva delante
    const prefix = byCpu && state.notice ? state.notice + ' ' : '';
    if (state.steal) {
      if (!state.steal.targetKey) return; // aún no ha elegido a quién robar
      this.completeSteal(categoryKey);
    } else {
      player.slots[categoryKey] = state.currentCharacter;
      const cat = CATEGORIES.find((c) => c.key === categoryKey);
      state.notice = byCpu ? `🤖 CPU colocó a ${state.currentCharacter.name} en ${cat.icon} ${cat.label}.` : null;
    }
    if (byCpu) state.notice = prefix + state.notice;
    this.endTurn();
  },

  /* ---------- Comodín: descarte ---------- */

  /** Descarta la carta actual y roba otra del mazo (1 vez por partida). */
  discard(byCpu = false) {
    if (this.blocked(byCpu) || state.steal) return;
    const player = this.me();
    if (player.discards < 1) return;
    player.discards--;
    const old = state.currentCharacter;
    this.drawCharacter();
    state.notice = `🎲 ${PLAYER_META[state.currentPlayer].name} descartó a ${old.name}.`;
    render();
  },

  /* ---------- Comodín: robo ---------- */

  /** Personajes del rival que se pueden robar (los ya robados quedan bloqueados). */
  stealableKeys() {
    const slots = this.rival().slots;
    return CATEGORIES.map((c) => c.key)
      .filter((k) => slots[k] && !state.stolenIds.includes(slots[k].id));
  },

  canSteal() {
    return state.phase === 'draft' && this.me().steals > 0 && this.stealableKeys().length > 0;
  },

  startSteal(byCpu = false) {
    if (this.blocked(byCpu) || !this.canSteal()) return;
    state.steal = { targetKey: null };
    render();
  },

  cancelSteal() {
    if (this.blocked(false)) return;
    state.steal = null;
    render();
  },

  /** Paso 1 del robo: elegir qué personaje del rival quedarse. */
  pickStealTarget(key, byCpu = false) {
    if (this.blocked(byCpu)) return;
    if (!state.steal || !this.stealableKeys().includes(key)) return;
    state.steal.targetKey = key;
    render();
  },

  /** Paso 2 del robo: intercambio. Robado -> mi slot; mi carta -> slot del rival. */
  completeSteal(myKey) {
    const me = this.me(), rival = this.rival();
    const targetKey = state.steal.targetKey;
    const stolen = rival.slots[targetKey];
    const given = state.currentCharacter;

    me.slots[myKey] = stolen;
    rival.slots[targetKey] = given;
    me.steals--;
    state.stolenIds.push(stolen.id);

    const cat = CATEGORIES.find((c) => c.key === targetKey);
    state.notice = `🗡 ${PLAYER_META[state.currentPlayer].name} robó a ${stolen.name}. `
      + `${PLAYER_META[1 - state.currentPlayer].name} recibe a ${given.name} en ${cat.icon} ${cat.label}.`;
    state.steal = null;
  },

  /** Avanzar turno: J1 -> J2 -> siguiente ronda (o batalla). */
  endTurn() {
    if (state.currentPlayer === 0) {
      state.currentPlayer = 1;
    } else {
      state.currentPlayer = 0;
      state.round++;
    }

    if (state.round > TOTAL_ROUNDS) {
      state.currentCharacter = null;
      state.phase = 'battle';
    } else {
      this.drawCharacter();
    }
    render();
    if (state.phase === 'draft' && this.isCpuTurn()) CPU.takeTurn();
  },

  /** Revancha con el mismo modo y dificultad. */
  rematch() {
    this.start(state.mode, state.difficulty);
  },

  restart() {
    state = createInitialState();
    render();
  },
};

/* =========================================================================
 * 4b. CPU (modo 1 jugador)
 *     La CPU "conoce" el anime como un fan: recuerda cada estadística con un
 *     error que depende de la dificultad. Con esos valores estima, para cada
 *     jugada posible, cuántas categorías espera ganar y elige la mejor.
 * ========================================================================= */
const CPU = {
  THINK_MS: 1100,  // pausa entre pasos para que el jugador vea qué hace

  /** Valores percibidos por la CPU: { [id]: { fuerza, ... } } fijos durante la partida. */
  buildPerception(difficulty) {
    const { noise } = DIFFICULTIES[difficulty];
    const map = {};
    CHARACTER_POOL.forEach((ch) => {
      map[ch.id] = {};
      CATEGORIES.forEach(({ key }) => {
        const v = ch.stats[key] + (Math.random() * 2 - 1) * noise;
        map[ch.id][key] = Math.max(1, Math.min(100, Math.round(v)));
      });
    });
    return map;
  },

  see(ch, key) { return state.cpu[ch.id][key]; },

  /** Fracción de personajes del pool con menos de v en la categoría (empates cuentan la mitad). */
  cdf(key, v) {
    let below = 0;
    for (const ch of CHARACTER_POOL) {
      const s = this.see(ch, key);
      below += s < v ? 1 : s === v ? 0.5 : 0;
    }
    return below / CHARACTER_POOL.length;
  },

  /** Probabilidad estimada de ganar una categoría (null = slot aún vacío). */
  odds(key, mine, theirs) {
    if (mine == null && theirs == null) return 0.5;
    if (theirs == null) return this.cdf(key, mine);       // contra una carta futura al azar
    if (mine == null) return 1 - this.cdf(key, theirs);   // mi carta futura contra la suya
    return 1 / (1 + Math.exp(-(mine - theirs) / 4));       // ambos conocidos
  },

  /** Categorías que la CPU espera ganar con estos equipos. */
  evaluate(mySlots, rivalSlots) {
    return CATEGORIES.reduce((sum, { key }) => {
      const m = mySlots[key] ? this.see(mySlots[key], key) : null;
      const t = rivalSlots[key] ? this.see(rivalSlots[key], key) : null;
      return sum + this.odds(key, m, t);
    }, 0);
  },

  /** Todas las jugadas posibles con la carta actual, de mejor a peor. */
  options(card, allowSteal) {
    const me = state.players[1].slots, rival = state.players[0].slots;
    const empty = CATEGORIES.map((c) => c.key).filter((k) => !me[k]);
    const list = empty.map((k) => ({ type: 'place', slot: k, score: this.evaluate({ ...me, [k]: card }, rival) }));

    if (allowSteal && state.players[1].steals > 0) {
      // El robo es de un solo uso: guardarlo vale más cuanto más partida queda
      const reserve = 0.12 * (TOTAL_ROUNDS - state.round);
      for (const t of Game.stealableKeys()) {
        for (const k of empty) {
          const score = this.evaluate({ ...me, [k]: rival[t] }, { ...rival, [t]: card }) - reserve;
          list.push({ type: 'steal', target: t, slot: k, score });
        }
      }
    }
    return list.sort((a, b) => b.score - a.score);
  },

  /** ¿Merece la pena descartar? Compara con lo que daría, de media, una carta nueva. */
  shouldDiscard(bestScore) {
    const sample = shuffle(state.deck).slice(0, 25);
    if (!sample.length) return false;
    const expected = sample.reduce((s, c) => s + this.options(c, false)[0].score, 0) / sample.length;
    const reserve = 0.05 + 0.05 * (TOTAL_ROUNDS - state.round);
    return expected - bestScore > reserve;
  },

  /** Elige jugada (con algún error aleatorio en dificultades bajas). */
  decide(allowJokers) {
    const opts = this.options(state.currentCharacter, allowJokers);
    const { blunder } = DIFFICULTIES[state.difficulty];
    if (Math.random() < blunder) {
      const places = opts.filter((o) => o.type === 'place');
      return places[Math.floor(Math.random() * places.length)];
    }
    return opts[0];
  },

  /** Turno completo de la CPU, paso a paso y con pausas visibles. */
  async takeTurn() {
    const game = state;                       // si la partida cambia, se aborta
    const alive = () => state === game && state.phase === 'draft' && Game.isCpuTurn();
    const { jokers } = DIFFICULTIES[state.difficulty];

    state.busy = true;
    state.notice = null;                      // el aviso del humano ya no aplica
    render();
    await wait(this.THINK_MS);
    if (!alive()) return;

    let move = this.decide(jokers);
    if (jokers && Game.me().discards > 0 && move.type === 'place' && this.shouldDiscard(move.score)) {
      Game.discard(true);                     // deja el aviso "CPU descartó a ..."
      await wait(this.THINK_MS);
      if (!alive()) return;
      move = this.decide(jokers);
    }

    if (move.type === 'steal') {
      Game.startSteal(true);
      Game.pickStealTarget(move.target, true);
      await wait(this.THINK_MS + 400);
      if (!alive()) return;
    }

    state.busy = false;
    Game.assignSlot(move.slot, true);
  },
};

/* =========================================================================
 * 5. SISTEMA DE COMBATE
 * ========================================================================= */
const Battle = {
  /** Calcula todos los enfrentamientos de forma pura (sin tocar el DOM). */
  compute(players) {
    const wins = [0, 0];
    const results = CATEGORIES.map((cat) => {
      const c1 = players[0].slots[cat.key];
      const c2 = players[1].slots[cat.key];
      const v1 = c1.stats[cat.key];
      const v2 = c2.stats[cat.key];
      const winner = v1 > v2 ? 0 : v2 > v1 ? 1 : null; // null = empate
      if (winner !== null) wins[winner]++;
      return { cat, c1, c2, v1, v2, winner };
    });

    // Ganador al mejor de 5; si empatan en rondas, desempata la suma total.
    let winner = null, tiebreak = false;
    if (wins[0] !== wins[1]) {
      winner = wins[0] > wins[1] ? 0 : 1;
    } else {
      const t1 = results.reduce((s, r) => s + r.v1, 0);
      const t2 = results.reduce((s, r) => s + r.v2, 0);
      tiebreak = true;
      winner = t1 > t2 ? 0 : t2 > t1 ? 1 : null;
    }
    return { results, wins, winner, tiebreak };
  },

  /** Pausa dramática (se anula si el jugador pulsa "Saltar"). */
  pause(ms) {
    if (state.battle.skip) return Promise.resolve();
    return new Promise((resolve) => {
      const timer = setTimeout(resolve, ms);
      this.wake = () => { clearTimeout(timer); resolve(); };
    });
  },

  /** Acelera todo lo que queda de batalla, incluida la pausa en curso. */
  skip() {
    state.battle.skip = true;
    if (this.wake) this.wake();
  },

  /** Una ronda completa: rótulo -> cara a cara -> revelación -> impacto. */
  async playRound(r, i) {
    Arena.intro(i, r.cat);
    await this.pause(1400);
    Arena.versus(r, i);
    await this.pause(1300);
    await Arena.countUp(r);
    await this.pause(300);
    Arena.clash(r);
    await this.pause(1800);
  },

  /** Ejecuta la batalla completa con animación ronda por ronda. */
  async run() {
    if (state.busy) return;
    state.busy = true;
    const outcome = this.compute(state.players);
    state.battle = { results: [], wins: [0, 0], winner: null, tiebreak: false, skip: false };
    render();

    for (const [i, r] of outcome.results.entries()) {
      await this.playRound(r, i);
      state.battle.results.push(r);
      if (r.winner !== null) state.battle.wins[r.winner]++;
      refreshBattleSide(r.winner);
    }

    Arena.verdictTeaser(outcome.tiebreak);
    await this.pause(1800);
    state.battle.winner = outcome.winner;
    state.battle.tiebreak = outcome.tiebreak;
    if (state.mode === 'solo') Record.add(state.difficulty, outcome.winner);
    state.phase = 'result';
    state.busy = false;
    render();
  },
};

const wait = (ms) => new Promise((res) => setTimeout(res, ms));

/** Insignia de rareza (el mítico lleva brillo animado). */
function rarityBadge(ch) {
  const r = ch.rarity;
  return `<span class="rarity-badge ${r.key === 'mitico' ? 'mythic' : ''}" style="--r:${r.color}">${r.icon} ${r.label.toUpperCase()}</span>`;
}

/** Leyenda de rarezas con cuántos personajes hay de cada una. */
function rarityLegend() {
  return RARITIES.map((r) => {
    const n = CHARACTER_POOL.filter((c) => c.rarity === r).length;
    return `<span class="rarity-badge ${r.key === 'mitico' ? 'mythic' : ''}" style="--r:${r.color}">${r.icon} ${r.label.toUpperCase()} · ${n}</span>`;
  }).join(' ');
}

/** <img> local del personaje (vacío si ya sabemos que no tiene archivo). */
function imageTag(ch) {
  const known = imageResolved.get(ch.slug);
  if (known === -1) return '';
  const ext = known ?? 0;
  return `<img src="${IMAGE_DIR}${ch.slug}.${IMAGE_EXTENSIONS[ext]}" data-slug="${ch.slug}" data-ext="${ext}"
    alt="${ch.name}" class="absolute inset-0 w-full h-full object-cover object-top"
    onload="imageLoaded(this)" onerror="nextImageExt(this)" />`;
}

/** Retrato del personaje: avatar neón con iniciales + imagen local encima si existe. */
function portrait(ch, sizeCls, color) {
  const initials = ch.name.replace(/[^\p{L}\s]/gu, '').split(/\s+/).filter(Boolean)
    .map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  return `
    <div class="portrait relative shrink-0 ${sizeCls}" style="border-color:${color}">
      <div class="absolute inset-0 flex items-center justify-center font-display font-black"
        style="color:${color};text-shadow:0 0 10px ${color}">${initials}</div>
      ${imageTag(ch)}
    </div>`;
}

    <div class="mb-3 px-3 py-2 border border-red-400/60 bg-red-500/10 text-red-200 text-sm flex justify-between items-center gap-3">
      <span>${text}</span>
      <button onclick="Game.cancelSteal()" class="font-display text-xs tracking-widest text-slate-300 hover:text-white shrink-0">✕ CANCELAR</button>
    </div>`;
}

/** Botones de los comodines del jugador en turno. */
function jokerButtons() {
  if (state.steal || Game.isCpuTurn()) return '';
  const me = Game.me();
  const btn = (label, uses, enabled, action, hint) => `
    <button ${enabled ? `onclick="${action}"` : 'disabled'} title="${hint}"
      class="joker-btn flex-1 px-3 py-2 border font-display text-xs tracking-widest
      ${enabled ? 'border-yellow-300 text-yellow-300 hover:bg-yellow-300 hover:text-black' : 'border-slate-700 text-slate-600 cursor-not-allowed'}">
      ${label} (${uses})
    </button>`;
  const stealHint = me.steals < 1 ? 'Ya usaste tu robo'
    : Game.stealableKeys().length === 0 ? 'El rival no tiene personajes que se puedan robar' : 'Quédate un personaje del rival';
  return `
    <p class="text-xs font-display tracking-widest text-slate-500 mt-5 mb-2">COMODINES</p>
    <div class="flex gap-3">
      ${btn('🎲 DESCARTAR', me.discards, me.discards > 0, 'Game.discard()', me.discards > 0 ? 'Cambia tu carta por otra al azar' : 'Ya usaste tu descarte')}
      ${btn('🗡 ROBAR', me.steals, Game.canSteal(), 'Game.startSteal()', stealHint)}
    </div>`;
}

function slotButton(cat, assigned, ch, p) {
  if (assigned) {
    return `
      <button disabled class="slot-btn w-full text-left px-4 py-3 border border-slate-700 bg-slate-900/60 opacity-40 line-through flex justify-between">
        <span>${cat.icon} ${cat.label}</span><span class="text-sm">${assigned.name}</span>
      </button>`;
  }
  // Durante el paso 1 del robo (o el turno de la CPU) los slots no se pueden pulsar
  const waiting = (state.steal && !state.steal.targetKey) || Game.isCpuTurn();
  const label = Game.isCpuTurn() ? '…' : state.steal ? 'COLOCAR ROBADO ▸' : 'ASIGNAR ▸';
  return `
    <button ${waiting ? 'disabled' : `onclick="Game.assignSlot('${cat.key}')"`}
      class="slot-btn w-full text-left px-4 py-3 border-2 bg-black/40 flex justify-between items-center ${waiting ? 'opacity-40' : ''}"
      style="border-color:${p.color};color:${p.color}">
      <span class="font-bold">${cat.icon} ${cat.label}</span>
      <span class="font-display text-sm opacity-70">${label}</span>
    </button>`;
}

function teamPanel(pm) {
  const slots = state.players[pm.id].slots;
  const active = state.phase === 'draft' && state.currentPlayer === pm.id;
  // Las estadísticas permanecen ocultas hasta que su ronda se combate.
  const fought = new Set(state.battle.results.map((r) => r.cat.key));
  const isRevealed = (key) => state.phase === 'result' || (state.phase === 'battle' && fought.has(key));
  const revealedSum = CATEGORIES.reduce((s, c) => s + (slots[c.key] && isRevealed(c.key) ? slots[c.key].stats[c.key] : 0), 0);
  const total = fought.size === 0 && state.phase !== 'result' ? '???'
    : revealedSum + (CATEGORIES.every((c) => isRevealed(c.key)) ? '' : ' + ???');

  // Robo en curso: el panel del rival se vuelve seleccionable
  const isVictim = state.phase === 'draft' && state.steal && pm.id !== state.currentPlayer;
  const stealable = isVictim ? Game.stealableKeys() : [];
  const player = state.players[pm.id];
  const jokers = state.phase === 'draft'
    ? `<span class="text-xs text-slate-500" title="Comodines restantes">🎲${player.discards} · 🗡${player.steals}</span>` : '';

  return `
    <div class="panel p-5 ${active ? pm.border + ' border-2' : ''} ${isVictim ? 'border-2 border-red-400' : ''}">
      <div class="flex justify-between items-baseline gap-2 mb-3">
        <h3 class="font-display font-bold ${pm.glow}">${pm.name.toUpperCase()} ${jokers}</h3>
        <span class="text-sm text-slate-400">Poder total: <b class="text-slate-100">${total}</b></span>
      </div>
      <ul class="space-y-2">
        ${CATEGORIES.map(c => {
          const ch = slots[c.key];
          const canPick = stealable.includes(c.key);
          const picked = isVictim && state.steal.targetKey === c.key;
          const locked = ch && state.stolenIds.includes(ch.id);
          const rowCls = canPick
            ? `steal-target cursor-pointer ${picked ? 'bg-red-500/25 ring-2 ring-red-400' : 'hover:bg-red-500/15'}`
            : (isVictim && ch ? 'opacity-50' : '');
          return `<li ${canPick ? `onclick="Game.pickStealTarget('${c.key}')"` : ''}
              class="flex justify-between items-center gap-2 border-b border-white/5 pb-1 px-1 min-h-[2.75rem] ${rowCls}">
            <span class="text-slate-400 shrink-0">${c.icon} ${c.label}</span>
            ${ch ? `<span class="flex items-center gap-2 min-w-0">${portrait(ch, 'w-9 h-9 text-xs', pm.color)}<span class="text-slate-200 truncate"><span style="color:${ch.rarity.color}" title="${ch.rarity.label}">${ch.rarity.icon}</span> ${ch.name}${locked ? ' <span title="Robado: ya no se puede volver a robar">🔒</span>' : ''}</span> <b style="color:${pm.color}">${isRevealed(c.key) ? ch.stats[c.key] : '??'}</b></span>`
                 : `<span class="text-slate-600 italic">— vacío —</span>`}
          </li>`;
        }).join('')}
      </ul>
    </div>`;
}

/* ---------- Vista de batalla: marcador + arena + equipos + registro ---------- */
function viewBattle() {
  const started = state.busy || state.phase === 'result';
  return `
    <section id="scoreboard" class="mb-4">${scoreboard()}</section>

    <section id="arena" class="panel relative overflow-hidden p-4 sm:p-8 mb-8 min-h-[24rem]">
      ${state.phase === 'result' ? resultBanner() : !started ? battleReady() : ''}
    </section>

    <section id="teams" class="grid md:grid-cols-2 gap-6 mb-8">${teamsHtml()}</section>

    <section class="panel p-6">
      <h2 class="font-display text-lg glow-accent mb-4">⚔ REGISTRO DE BATALLA</h2>
      <div id="battle-log" class="space-y-3">${logHtml()}</div>
    </section>`;
}

const teamsHtml = () => PLAYER_META.map((pm) => teamPanel(pm)).join('');

function logHtml() {
  const res = state.battle.results;
  return res.length
    ? res.map((r, i) => roundRow(r, i)).join('')
    : '<p class="text-slate-600 italic text-center">Aún no hay enfrentamientos.</p>';
}

/** Repinta marcador, equipos y registro sin tocar la arena (que está animándose). */
function refreshBattleSide(bumpSide = null) {
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  set('scoreboard', scoreboard(bumpSide));
  set('teams', teamsHtml());
  set('battle-log', logHtml());
}

function scoreboard(bumpSide = null) {
  const b = state.battle;
  const pips = CATEGORIES.map((c, i) => {
    const r = b.results[i];
    const cls = !r
      ? (state.busy && i === b.results.length ? 'bg-white animate-pulse' : 'bg-slate-700')
      : r.winner === null ? 'bg-yellow-300' : r.winner === 0 ? 'bg-cyan-400' : 'bg-pink-400';
    return `<span title="${c.label}" class="w-3 h-3 rotate-45 ${cls}"></span>`;
  }).join('');
  return `
    <div class="panel px-4 sm:px-8 py-3 flex items-center justify-between gap-3">
      <span class="font-display text-xs sm:text-sm glow-p1">${PLAYER_META[0].name.toUpperCase()}</span>
      <div class="flex flex-col items-center gap-2">
        <div class="font-display font-black text-3xl sm:text-4xl">
          <span class="glow-p1 inline-block ${bumpSide === 0 ? 'bump' : ''}">${b.wins[0]}</span>
          <span class="text-slate-600">:</span>
          <span class="glow-p2 inline-block ${bumpSide === 1 ? 'bump' : ''}">${b.wins[1]}</span>
        </div>
        <div class="flex gap-3">${pips}</div>
      </div>
      <span class="font-display text-xs sm:text-sm glow-p2">${PLAYER_META[1].name.toUpperCase()}</span>
    </div>
    ${state.busy ? `
      <div class="text-right mt-2">
        <button onclick="Battle.skip()" class="text-xs font-display tracking-widest text-slate-500 hover:text-white">⏩ SALTAR ANIMACIÓN</button>
      </div>` : ''}`;
}

function battleReady() {
  return `
    <div class="flex flex-col items-center justify-center min-h-[20rem] text-center">
      <p class="font-display text-xs tracking-[.4em] text-slate-500 mb-3">LOS LUCHADORES ESTÁN LISTOS</p>
      <p class="mb-8 text-lg text-slate-300">Las estadísticas se revelarán en cada enfrentamiento.</p>
      <button onclick="Battle.run()" class="btn-neon px-10 py-4 text-lg font-bold tracking-widest">⚔ INICIAR BATALLA</button>
    </div>`;
}

/* ---------- Arena: escenas animadas de cada ronda (manipula solo #arena) ---------- */
const Arena = {
  el: () => document.getElementById('arena'),

  set(html) { const el = this.el(); if (el) el.innerHTML = html; },

  /** Escena 1: rótulo de la ronda y la categoría. */
  intro(i, cat) {
    const label = i === TOTAL_ROUNDS - 1 ? '¡RONDA FINAL!' : `RONDA ${i + 1} / ${TOTAL_ROUNDS}`;
    this.set(`
      <div class="speedlines"></div>
      <div class="relative flex flex-col items-center justify-center min-h-[20rem] text-center">
        <p class="font-display tracking-[.5em] text-slate-300 slam">${label}</p>
        <div class="text-7xl sm:text-8xl my-3 slam" style="animation-delay:.15s">${cat.icon}</div>
        <h2 class="font-display font-black text-4xl sm:text-6xl glow-accent slam" style="animation-delay:.3s">${cat.label.toUpperCase()}</h2>
      </div>`);
  },

  /** Escena 2: cara a cara, con las estadísticas aún ocultas. */
  versus(r, i) {
    this.set(`
      <div class="speedlines"></div>
      <div class="relative">
        <p class="text-center font-display text-xs tracking-[.4em] text-slate-400 mb-4">
          RONDA ${i + 1} · ${r.cat.icon} ${r.cat.label.toUpperCase()}
        </p>
        <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2 sm:gap-6">
          ${fighterCard(r.c1, 0)}
          <div class="vs font-display font-black text-3xl sm:text-6xl text-white">VS</div>
          ${fighterCard(r.c2, 1)}
        </div>
      </div>`);
  },

  /** Escena 3: los dos valores suben a la vez; el más bajo se detiene antes. */
  countUp(r) {
    const targets = [r.v1, r.v2];
    const top = Math.max(r.v1, r.v2);
    const duration = 1800;
    const auras = [0, 1].map((s) => document.getElementById(`aura-${s}`));
    auras.forEach((a) => a && a.classList.add('charging'));

    return new Promise((resolve) => {
      const t0 = performance.now();
      const tick = (now) => {
        const p = state.battle.skip ? 1 : Math.min(1, (now - t0) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        targets.forEach((target, s) => {
          const v = Math.min(target, Math.round(top * eased));
          const val = document.getElementById(`val-${s}`);
          const bar = document.getElementById(`bar-${s}`);
          if (val) val.textContent = v;
          if (bar) bar.style.width = v + '%';
          // Apaga el aura del que ya llegó a su tope
          if (v === target && p > 0 && auras[s]) auras[s].classList.remove('charging');
        });
        if (p < 1) requestAnimationFrame(tick);
        else resolve();
      };
      requestAnimationFrame(tick);
    });
  },

  /** Escena 4: impacto, destello y veredicto de la ronda. */
  clash(r) {
    const arena = this.el();
    if (!arena) return;
    arena.classList.remove('big-shake');
    void arena.offsetWidth; // reinicia la animación
    arena.classList.add('big-shake');
    arena.insertAdjacentHTML('beforeend', '<div class="flash"></div>');

    [0, 1].forEach((s) => {
      const f = document.getElementById(`fighter-${s}`);
      if (!f || r.winner === null) return;
      f.classList.add(r.winner === s ? 'winner' : 'loser');
    });

    const diff = Math.abs(r.v1 - r.v2);
    const title = r.winner === null ? '¡CHOQUE IGUALADO!'
      : diff >= 40 ? '¡DOMINACIÓN TOTAL!'
      : diff >= 15 ? '¡GOLPE CRÍTICO!'
      : diff <= 3 ? '¡POR LOS PELOS!'
      : '¡VICTORIA!';
    const pm = r.winner === null ? null : PLAYER_META[r.winner];
    arena.insertAdjacentHTML('beforeend', `
      <div class="stamp z-20 text-center pointer-events-none whitespace-nowrap">
        <p class="font-display font-black text-3xl sm:text-6xl ${pm ? pm.glow : 'text-yellow-300'}"
           style="-webkit-text-stroke:1px #000">${title}</p>
        <p class="font-display text-xs sm:text-sm tracking-[.3em] mt-1 text-white">
          ${pm ? `PUNTO PARA ${pm.name.toUpperCase()}` : 'NADIE PUNTÚA'}
        </p>
      </div>`);
  },

  /** Suspense antes del veredicto final. */
  verdictTeaser(tiebreak) {
    this.set(`
      <div class="speedlines"></div>
      <div class="relative flex flex-col items-center justify-center min-h-[20rem] text-center">
        <p class="font-display tracking-[.5em] text-slate-300 slam">${tiebreak ? 'EMPATE EN RONDAS' : 'LA BATALLA HA TERMINADO'}</p>
        <h2 class="font-display font-black text-3xl sm:text-5xl glow-accent slam mt-4" style="animation-delay:.25s">
          ${tiebreak ? 'DECIDE EL PODER TOTAL...' : 'VEREDICTO FINAL...'}
        </h2>
      </div>`);
  },
};

function fighterCard(ch, side) {
  const pm = PLAYER_META[side];
  return `
    <div id="fighter-${side}" class="fighter flex flex-col items-center text-center min-w-0 ${side === 0 ? 'slide-l' : 'slide-r'}" style="--c:${pm.color}">
      <p class="font-display text-[10px] sm:text-xs tracking-widest ${pm.glow} mb-2">${pm.name.toUpperCase()}</p>
      <div id="aura-${side}" class="aura">${portrait(ch, 'w-24 h-32 sm:w-36 sm:h-48 text-3xl', pm.color)}</div>
      <h3 class="font-display font-bold mt-3 text-xs sm:text-lg leading-tight break-words">${ch.name}</h3>
      <p class="text-[11px] sm:text-xs text-slate-500">${ch.anime}</p>
      <div class="mt-1">${rarityBadge(ch)}</div>
      <div id="val-${side}" class="font-display font-black text-4xl sm:text-6xl mt-2 ${pm.glow}">??</div>
      <div class="w-full max-w-[10rem] h-2 bg-slate-800 rounded mt-2">
        <div id="bar-${side}" class="h-2 rounded" style="width:0%;background:${pm.color};box-shadow:0 0 10px ${pm.color}"></div>
      </div>
    </div>`;
}

function roundRow(r, i) {
  const winCls = (side) => r.winner === side ? 'font-black' : 'opacity-50';
  const verdict = r.winner === null
    ? '<span class="text-yellow-300">EMPATE</span>'
    : `<span class="${PLAYER_META[r.winner].glow}">GANA ${PLAYER_META[r.winner].name.toUpperCase()}</span>`;
  const isNew = state.busy && i === state.battle.results.length - 1;
  return `
    <div class="${isNew ? 'pop-in' : ''} border border-white/10 bg-black/40 p-4">
      <div class="flex justify-between text-xs font-display tracking-widest text-slate-500 mb-2">
        <span>RONDA ${i + 1} · ${r.cat.icon} ${r.cat.label.toUpperCase()}</span>${verdict}
      </div>
      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
        <div class="${winCls(0)} min-w-0">
          <div class="flex items-center gap-2">${portrait(r.c1, 'w-10 h-10 text-xs', 'var(--p1)')}<div class="text-sm truncate">${r.c1.name}</div></div>
          <div class="h-3 bg-slate-800 rounded mt-1"><div class="h-3 rounded" style="width:${r.v1}%;background:var(--p1);box-shadow:0 0 10px var(--p1)"></div></div>
        </div>
        <div class="font-display text-lg whitespace-nowrap"><span class="glow-p1">${r.v1}</span> <span class="text-slate-600">vs</span> <span class="glow-p2">${r.v2}</span></div>
        <div class="${winCls(1)} text-right min-w-0">
          <div class="flex flex-row-reverse items-center gap-2">${portrait(r.c2, 'w-10 h-10 text-xs', 'var(--p2)')}<div class="text-sm truncate">${r.c2.name}</div></div>
          <div class="h-3 bg-slate-800 rounded mt-1 flex justify-end"><div class="h-3 rounded" style="width:${r.v2}%;background:var(--p2);box-shadow:0 0 10px var(--p2)"></div></div>
        </div>
      </div>
    </div>`;
}

/** Pantalla final: campeón, su equipo completo y opción de revancha. */
function resultBanner() {
  const b = state.battle;
  const pm = b.winner === null ? null : PLAYER_META[b.winner];
  const totals = state.players.map((p) => CATEGORIES.reduce((s, c) => s + p.slots[c.key].stats[c.key], 0));
  const solo = state.mode === 'solo';
  const title = !pm ? '<span class="text-yellow-300">¡EMPATE ABSOLUTO!</span>'
    : solo && b.winner === 0 ? `<span class="${pm.glow}">¡VICTORIA!</span>`
    : solo ? `<span class="${pm.glow}">¡DERROTA! LA CPU GANA</span>`
    : `<span class="${pm.glow}">¡${pm.name.toUpperCase()} GANA!</span>`;
  const soloInfo = solo
    ? `<p class="text-xs text-slate-500 mt-2">CPU ${DIFFICULTIES[state.difficulty].label} · Tu récord: ${Record.text(state.difficulty)}</p>` : '';
  const note = b.tiebreak
    ? `Empate en rondas — decidido por poder total: ${totals[0]} vs ${totals[1]}.`
    : `Poder total: ${totals[0]} vs ${totals[1]}`;

  // Marcador final en formato "3/5" por jugador
  const ties = TOTAL_ROUNDS - b.wins[0] - b.wins[1];
  const playerScore = (id) => `
    <div class="text-center">
      <p class="text-xs tracking-widest ${PLAYER_META[id].glow}">${PLAYER_META[id].name.toUpperCase()}</p>
      <p class="text-4xl sm:text-6xl font-black ${PLAYER_META[id].glow}">${b.wins[id]}/${TOTAL_ROUNDS}</p>
      <p class="text-[11px] text-slate-500 tracking-widest">RONDAS GANADAS</p>
    </div>`;
  const scoreLine = `
    <div class="flex justify-center items-center gap-5 sm:gap-10 mt-8 font-display">
      ${playerScore(0)}
      <span class="text-slate-600 text-xl sm:text-2xl">VS</span>
      ${playerScore(1)}
    </div>
    ${ties ? `<p class="text-yellow-300 text-sm mt-2">${ties} ronda${ties > 1 ? 's' : ''} empatada${ties > 1 ? 's' : ''}</p>` : ''}`;

  // Desglose: quién ganó cada categoría
  const side = (r, id) => r.winner === id ? `font-bold ${PLAYER_META[id].glow}` : r.winner === null ? 'text-yellow-200' : 'text-slate-500';
  const breakdown = `
    <div class="max-w-xl mx-auto mt-5 text-sm border border-white/10 bg-black/40 divide-y divide-white/5">
      ${b.results.map((r) => `
        <div class="grid grid-cols-[1fr_2.5rem_auto_2.5rem_1fr] items-center gap-2 px-3 py-2">
          <span class="text-right truncate ${side(r, 0)}">${r.winner === 0 ? '✔ ' : ''}${r.c1.name}</span>
          <span class="text-right font-display ${side(r, 0)}">${r.v1}</span>
          <span class="text-slate-400 text-xs whitespace-nowrap" title="${r.cat.label}">${r.cat.icon} ${r.cat.label}</span>
          <span class="text-left font-display ${side(r, 1)}">${r.v2}</span>
          <span class="text-left truncate ${side(r, 1)}">${r.c2.name}${r.winner === 1 ? ' ✔' : ''}</span>
        </div>`).join('')}
    </div>`;
  const team = pm ? `
    <div class="flex justify-center gap-2 sm:gap-4 mt-6 flex-wrap">
      ${CATEGORIES.map((c, i) => {
        const ch = state.players[b.winner].slots[c.key];
        return `<div class="pop-in flex flex-col items-center" style="animation-delay:${0.4 + i * 0.12}s">
          ${portrait(ch, 'w-14 h-20 sm:w-20 sm:h-28 text-sm', pm.color)}
          <span class="text-[11px] text-slate-400 mt-1">${c.icon} ${ch.stats[c.key]}</span>
        </div>`;
      }).join('')}
    </div>` : '';
  return `
    <div class="speedlines"></div>
    <div class="flash"></div>
    <div class="relative text-center py-4">
      <p class="font-display text-xs tracking-[.4em] text-slate-400">— VEREDICTO FINAL —</p>
      <h2 class="font-display font-black text-4xl sm:text-6xl my-3 slam">${title}</h2>
      ${pm ? `<p class="font-display tracking-[.3em] text-sm text-slate-300">EL PERSONAJE MÁS PODEROSO</p>` : ''}
      ${team}
      ${scoreLine}
      ${breakdown}
      <p class="text-slate-400 mt-4">${note}</p>
      ${soloInfo}
      <div class="flex flex-wrap justify-center gap-3 mt-6">
        <button onclick="Game.rematch()" class="btn-neon px-8 py-3 font-bold tracking-widest">↻ REVANCHA</button>
        <button onclick="Game.restart()" class="px-6 py-3 border border-slate-600 text-slate-400 hover:text-white hover:border-white font-display text-sm tracking-widest">MENÚ</button>
      </div>
    </div>`;
}

/* =========================================================================
 * 7. ARRANQUE
 * ========================================================================= */
render();
</script>
</body>
</html>
